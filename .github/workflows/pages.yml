# 每次 push 到 main：重新執行 Car Price 回歸分析，產生最新 results.js，再把整個 repo 部署到 GitHub Pages
name: Build & Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 04-car-price-regression/requirements.txt

      - name: Install dependencies
        run: pip install -r 04-car-price-regression/requirements.txt

      - name: Run Car Price regression analysis
        working-directory: 04-car-price-regression
        run: python analyze.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
